name: Studio360 Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker.yml-${{ github.ref_name }}
  cancel-in-progress: false

jobs:

  validate:
    name: Validate source and deployment contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Assert source identity and compile Python sources
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.repository }}" = "V-Viebal/studio360"
          case "${GITHUB_REF}" in refs/heads/main|refs/heads/staging) ;; *) exit 1 ;; esac
          python3 -m compileall -q lib server scripts
      - name: Validate deployment scripts and Compose contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/coolify_ghcr_start.sh
          bash -n scripts/coolify_registry_credentials.sh
          bash -n scripts/deploy_coolify_application.sh
          node --check scripts/reconcile_coolify_registry_credentials.mjs
          node --test scripts/deployment_workflow_contract.test.mjs
          touch .env
          POSTGRES_PASSWORD=validation-only docker compose -f compose.yaml config -q

  build:
    name: Build immutable image on GitHub-hosted runner
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
      image_digest: ${{ steps.image.outputs.image_digest }}
      target_role: ${{ steps.target.outputs.role }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Resolve target role
        id: target
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${GITHUB_REF}" in refs/heads/main) role=production ;; refs/heads/staging) role=staging ;; *) exit 1 ;; esac
          echo "role=${role}" >>"${GITHUB_OUTPUT}"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to private GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable image with SBOM and provenance
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # The repository's production container is the Python/FastAPI
          # image in Dockerfile. Dockerfile.studio360 is a retired Next.js
          # artifact and does not match this repository's root layout.
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/v-viebal/studio360:${{ github.sha }}
            ghcr.io/v-viebal/studio360:${{ steps.target.outputs.role }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            RELEASE_SHA=${{ github.sha }}
            STUDIO360_RELEASE_SHA=${{ github.sha }}
          cache-from: type=gha,scope=studio360-${{ steps.target.outputs.role }}
          cache-to: type=gha,mode=max,scope=studio360-${{ steps.target.outputs.role }}
          provenance: mode=max
          sbom: true

      - name: Resolve exact registry digest
        id: image
        shell: bash
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "${BUILD_DIGEST}" == sha256:* ]] || { echo "Build did not return an OCI digest." >&2; exit 1; }
          echo "image_digest=${BUILD_DIGEST}" >>"${GITHUB_OUTPUT}"
          echo "image_ref=ghcr.io/v-viebal/studio360@${BUILD_DIGEST}" >>"${GITHUB_OUTPUT}"

      - name: Verify GHCR package is private
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          set -Eeuo pipefail
          anonymous_token="$(curl --fail --silent --show-error 'https://ghcr.io/token?service=ghcr.io&scope=repository:v-viebal/studio360:pull' | jq -r '.token // empty' || true)"
          if [[ -z "${anonymous_token}" ]]; then echo "GHCR denied anonymous pull access as expected."; exit 0; fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "Authorization: Bearer ${anonymous_token}" --header 'Accept: application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/v-viebal/studio360/manifests/${IMAGE_DIGEST}")"
          case "${status}" in 401|403|404) ;; 200) echo "GHCR package is anonymously readable; expected private." >&2; exit 1 ;; *) echo "Unexpected anonymous GHCR response: HTTP ${status}" >&2; exit 1 ;; esac

  deploy:
    name: Deploy immutable digest through locked Coolify Application
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      packages: read
    env:
      IMAGE_REF: ${{ needs.build.outputs.image_ref }}
      RELEASE_SHA: ${{ github.sha }}
      IMAGE_REPO: ghcr.io/v-viebal/studio360
      INFISICAL_API_URL: https://keys.hmz.one
      INFISICAL_PROJECT_SLUG: studio360-i-cn-8
      INFISICAL_ENV_SLUG: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      INFISICAL_IDENTITY_ID: ${{ github.ref_name == 'main' && (vars.INFISICAL_PRODUCTION_IDENTITY_ID || '2a377305-f516-4d0f-a9a7-7eec3fac01e4') || (vars.INFISICAL_STAGING_IDENTITY_ID || '264338aa-530f-46e5-9d73-cb31b1006c05') }}
      INFISICAL_SECRET_PATH: ${{ github.ref_name == 'main' && '/github-actions' || '/deploy/github-actions' }}
      INFISICAL_ORIGIN_IP: 142.91.101.5
      COOLIFY_ORIGIN_IP: 142.91.101.5
      COOLIFY_PROJECT_UUID: m11b6voah95haymnyc6oyjeh
      COOLIFY_ENVIRONMENT_UUID: ${{ github.ref_name == 'main' && 'w13z2lnb7lbhqwgwjkki307d' || 'wuvpyvkxizpsuikd78u20zl2' }}
      COOLIFY_ENVIRONMENT_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      COOLIFY_DESTINATION_UUID: tt6sqgkq1jr2xf4h9u22h9fa
      COOLIFY_SERVER_UUID: rejddmxzsu85aiq1zqnt48wr
      COOLIFY_APPLICATION_UUID: ${{ github.ref_name == 'main' && (vars.STUDIO360_PRODUCTION_APPLICATION_UUID || '5mvkdfjxuh6uko7brzhqxnp1') || (vars.STUDIO360_STAGING_APPLICATION_UUID || 'htortr9hw2g9ifpeh8p76ner') }}
      COOLIFY_APPLICATION_NAME: ${{ github.ref_name == 'main' && 'studio360-production' || 'studio360-staging' }}
      COOLIFY_PUBLIC_DOMAIN: ${{ github.ref_name == 'main' && 'studio360.hmz.one' || 'studio360-staging.hmz.one' }}
      COOLIFY_GIT_BRANCH: ${{ github.ref_name }}
      COOLIFY_GIT_REPOSITORY: V-Viebal/studio360
      COOLIFY_COMPOSE_LOCATION: /compose.yaml
      COOLIFY_PORTS_EXPOSES: "1241"
      HEALTH_URL: ${{ github.ref_name == 'main' && 'https://studio360.hmz.one/health' || 'https://studio360-staging.hmz.one/health' }}
      HEALTH_EXPECTED_REGEX: status
      COMPOSE_PROJECT_NAME: studio360-${{ github.ref_name }}
    steps:
      - name: Checkout exact deployment revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify target-scoped deployment variables
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ github.repository }}" = "V-Viebal/studio360"
          case "${{ github.ref_name }}" in main|staging) ;; *) echo "Unsupported release ref." >&2; exit 1 ;; esac
          : "${INFISICAL_IDENTITY_ID:?Target Infisical OIDC identity is not configured}"
          : "${COOLIFY_APPLICATION_UUID:?Target Coolify Application is not configured}"
          [[ "${COOLIFY_APPLICATION_UUID}" != UNCONFIGURED_* ]] || { echo "Target Application is intentionally unconfigured." >&2; exit 1; }
      - name: Route Infisical and Coolify through verified origins
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${INFISICAL_ORIGIN_IP} keys.hmz.one" | sudo tee -a /etc/hosts >/dev/null
          echo "${COOLIFY_ORIGIN_IP} host.hmz.one" | sudo tee -a /etc/hosts >/dev/null

      - name: Verify GitHub OIDC claims without exposing the token
        env:
          EXPECTED_OIDC_SUBJECT: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}:ref:refs/heads/${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is missing}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is missing}"
          oidc_token="$(curl --fail --silent --show-error --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fgithub.com%2FV-Viebal" | jq -r '.value // empty')"
          : "${oidc_token:?GitHub did not return an OIDC token}"
          claims="$(printf '%s' "${oidc_token}" | python3 -c 'import base64,json,sys; p=sys.stdin.read().split(".")[1]; p += "=" * (-len(p) % 4); c=json.loads(base64.urlsafe_b64decode(p)); print(json.dumps({"sub":c.get("sub"),"aud":c.get("aud")}))')"
          observed_subject="$(jq -r '.sub // empty' <<<"${claims}")"
          observed_audience="$(jq -r 'if (.aud | type) == "array" then join(",") else (.aud // empty) end' <<<"${claims}")"
          if [[ "${observed_subject}" != "${EXPECTED_OIDC_SUBJECT}" || "${observed_audience}" != "https://github.com/V-Viebal" ]]; then
            echo "OIDC claim mismatch: subject=${observed_subject} audience=${observed_audience}" >&2
            exit 1
          fi
          unset oidc_token

      - name: Fetch target-scoped Coolify credentials from Infisical
        uses: Infisical/secrets-action@a663da43e1541832614bfd9dcf9ab67381ea2b98 # v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/V-Viebal
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}

      - name: Deploy, poll, verify, and roll back on failure
        id: deploy
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_PREVIOUS_IMAGE: "true"
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL was not provided by target Infisical scope}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN was not provided by target Infisical scope}"
          bash scripts/deploy_coolify_application.sh

      - name: Emit secret-free deployment receipt
        shell: bash
        run: |
          jq -cn --arg repository "${GITHUB_REPOSITORY}" --arg revision "${GITHUB_SHA}" --arg image "${IMAGE_REF}" --arg application "${COOLIFY_APPLICATION_UUID}" --arg deployment "${{ steps.deploy.outputs.deployment_uuid }}" --arg previous "${{ steps.deploy.outputs.previous_image }}" --arg domain "${COOLIFY_PUBLIC_DOMAIN}" '{repository:$repository,revision:$revision,image:$image,coolify_application_uuid:$application,deployment_uuid:$deployment,previous_image:$previous,domain:$domain,health:"verified",sbom:"published",provenance:"published"}'

  registry_credentials_cleanup:
    name: Independently clear temporary GHCR credentials
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      INFISICAL_API_URL: https://keys.hmz.one
      INFISICAL_PROJECT_SLUG: studio360-i-cn-8
      INFISICAL_ENV_SLUG: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
      INFISICAL_IDENTITY_ID: ${{ github.ref_name == 'main' && (vars.INFISICAL_PRODUCTION_IDENTITY_ID || '2a377305-f516-4d0f-a9a7-7eec3fac01e4') || (vars.INFISICAL_STAGING_IDENTITY_ID || '264338aa-530f-46e5-9d73-cb31b1006c05') }}
      INFISICAL_SECRET_PATH: ${{ github.ref_name == 'main' && '/github-actions' || '/deploy/github-actions' }}
      INFISICAL_ORIGIN_IP: 142.91.101.5
      COOLIFY_ORIGIN_IP: 142.91.101.5
      COOLIFY_PROJECT_UUID: m11b6voah95haymnyc6oyjeh
      COOLIFY_ENVIRONMENT_UUID: ${{ github.ref_name == 'main' && 'w13z2lnb7lbhqwgwjkki307d' || 'wuvpyvkxizpsuikd78u20zl2' }}
      COOLIFY_ENVIRONMENT_NAME: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      COOLIFY_DESTINATION_UUID: tt6sqgkq1jr2xf4h9u22h9fa
      COOLIFY_SERVER_UUID: rejddmxzsu85aiq1zqnt48wr
      COOLIFY_APPLICATION_UUID: ${{ github.ref_name == 'main' && (vars.STUDIO360_PRODUCTION_APPLICATION_UUID || '5mvkdfjxuh6uko7brzhqxnp1') || (vars.STUDIO360_STAGING_APPLICATION_UUID || 'htortr9hw2g9ifpeh8p76ner') }}
      COOLIFY_APPLICATION_NAME: ${{ github.ref_name == 'main' && 'studio360-production' || 'studio360-staging' }}
      COOLIFY_PUBLIC_DOMAIN: ${{ github.ref_name == 'main' && 'studio360.hmz.one' || 'studio360-staging.hmz.one' }}
      COOLIFY_GIT_BRANCH: ${{ github.ref_name }}
      COOLIFY_GIT_REPOSITORY: V-Viebal/studio360
    steps:
      - name: Checkout exact cleanup implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Route Infisical and Coolify through verified origins
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "${INFISICAL_ORIGIN_IP} keys.hmz.one" | sudo tee -a /etc/hosts >/dev/null
          echo "${COOLIFY_ORIGIN_IP} host.hmz.one" | sudo tee -a /etc/hosts >/dev/null
      - name: Fetch target-scoped cleanup credentials
        uses: Infisical/secrets-action@a663da43e1541832614bfd9dcf9ab67381ea2b98 # v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/V-Viebal
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV_SLUG }}
          domain: ${{ env.INFISICAL_API_URL }}
          secret-path: ${{ env.INFISICAL_SECRET_PATH }}
      - name: Delete and verify all temporary registry rows
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${COOLIFY_URL:?COOLIFY_URL was not provided by target Infisical scope}"
          : "${COOLIFY_API_TOKEN:?COOLIFY_API_TOKEN was not provided by target Infisical scope}"
          bash scripts/coolify_registry_credentials.sh clear
          node scripts/reconcile_coolify_registry_credentials.mjs
